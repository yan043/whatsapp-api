<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Dasbor · WhatsApp API Gateway</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" type="image/png" href="/assets/icon/favicon.png" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="/assets/css/dashboard.css" />
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-logo">💬</div>
                    <div class="brand-text">
                        <h1>WA Gateway</h1>
                        <span data-i18n="brand.subtitle">Multi-Session API</span>
                    </div>
                </div>
                <a href="/" class="nav-link active"><span class="nav-icon">🔗</span> <span data-i18n="nav.connection">Koneksi</span></a>
                <a href="/crm" class="nav-link"><span class="nav-icon">💼</span> <span data-i18n="nav.crm">CRM</span></a>
                <a href="/broadcast" class="nav-link"><span class="nav-icon">📢</span> <span data-i18n="nav.broadcast">Siaran</span></a>
                <a href="/templates-page" class="nav-link"><span class="nav-icon">📝</span> <span data-i18n="nav.templates">Templat</span></a>
                <a href="/bot-page" class="nav-link"><span class="nav-icon">🤖</span> <span data-i18n="nav.bot">Bot</span></a>
                <div class="sidebar-footer">
                    &copy; <span id="year"></span> <a href="https://github.com/yan043" target="_blank" rel="noopener noreferrer">yan043</a>
                </div>
            </aside>

            <main class="main">
                <div class="topbar">
                    <div class="topbar-user" id="sidebar-user"></div>
                    <div class="topbar-right">
                        <div class="lang-options">
                            <button type="button" class="lang-btn" data-lang-btn="id">ID</button>
                            <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
                        </div>
                        <div class="page-clock">
                            <div class="clock-date" id="clock-date"></div>
                            <div class="clock-time" id="clock-time"></div>
                        </div>
                    </div>
                </div>
                <div class="page-head">
                    <div>
                        <h2 data-i18n="page.connection.title">Koneksi</h2>
                        <p data-i18n="page.connection.subtitle">Buat sesi, pindai kode QR, dan kelola perangkat WhatsApp yang tertaut.</p>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-icon green">📱</div>
                        <div>
                            <div class="stat-value" id="stat-total">0</div>
                            <div class="stat-label" data-i18n="stat.totalSessions">Total Sesi</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">✅</div>
                        <div>
                            <div class="stat-value" id="stat-ready">0</div>
                            <div class="stat-label" data-i18n="stat.connected">Terhubung</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon amber">⏳</div>
                        <div>
                            <div class="stat-value" id="stat-pending">0</div>
                            <div class="stat-label" data-i18n="stat.pending">Menunggu</div>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <h3 class="card-title" data-i18n="card.newSession">➕ Sesi Baru</h3>
                        <form id="create-form">
                            <div class="field">
                                <label data-i18n="label.sessionId">ID Sesi</label>
                                <input class="input" id="client-id" data-i18n-placeholder="placeholder.sessionId" placeholder="mis. perangkat-utama" required />
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.createConnect">Buat &amp; Hubungkan</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="card-title" data-i18n="card.activeSessions">🔌 Sesi Aktif</h3>
                        <div class="sessions-grid" id="sessions-grid"></div>
                        <div class="empty-state" id="empty-state">
                            <div class="big-icon">📭</div>
                            <div data-i18n="empty.noSessions">Belum ada sesi. Buat satu untuk memulai.</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div class="toast-wrap" id="toast-wrap"></div>

        <script src="/assets/js/i18n.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
        <script>
            document.getElementById("year").textContent = new Date().getFullYear();

            function startClock()
            {
                const dateEl = document.getElementById("clock-date");
                const timeEl = document.getElementById("clock-time");
                if (!dateEl || !timeEl)
                {
                    return;
                }

                const dateFmt = new Intl.DateTimeFormat("id-ID", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                });

                const tick = function ()
                {
                    const now = new Date();
                    const hh = String(now.getHours()).padStart(2, "0");
                    const mm = String(now.getMinutes()).padStart(2, "0");
                    const ss = String(now.getSeconds()).padStart(2, "0");
                    dateEl.textContent = dateFmt.format(now);
                    timeEl.textContent = hh + ":" + mm + ":" + ss;
                };

                tick();
                setInterval(tick, 1000);
            }

            startClock();

            const socket = io();
            const grid = document.getElementById("sessions-grid");
            const emptyState = document.getElementById("empty-state");

            function statusText(status)
            {
                return i18n.t("status." + status);
            }

            function toast(message, isError)
            {
                const el = document.createElement("div");
                el.className = "toast" + (isError ? " error" : "");
                el.textContent = message;
                document.getElementById("toast-wrap").appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }

            function refreshStats()
            {
                const cards = grid.querySelectorAll(".session-card");
                let ready = 0;
                let pending = 0;

                cards.forEach((card) =>
                {
                    const status = card.dataset.status;
                    if (status === "ready")
                    {
                        ready++;
                    }
                    else if (["qr", "authenticated", "initializing"].includes(status))
                    {
                        pending++;
                    }
                });

                document.getElementById("stat-total").textContent = cards.length;
                document.getElementById("stat-ready").textContent = ready;
                document.getElementById("stat-pending").textContent = pending;
                emptyState.style.display = cards.length ? "none" : "block";
            }

            function escapeHtml(value)
            {
                const div = document.createElement("div");
                div.textContent = value == null ? "" : value;
                return div.innerHTML;
            }

            function renderCard(session)
            {
                const status = session.status || "offline";
                const card = document.createElement("div");
                card.className = "session-card";
                card.id = "session-" + session.id;
                card.dataset.status = status;
                card.innerHTML =
                    '<div class="session-top">' +
                        '<div>' +
                            '<div class="session-id">' + escapeHtml(session.id) + '</div>' +
                            '<div class="session-desc">' + escapeHtml(session.description) + '</div>' +
                        '</div>' +
                        '<span class="badge ' + status + '"><span class="dot"></span>' + statusText(status) + '</span>' +
                    '</div>' +
                    '<div class="qr-wrap"><img alt="QR Code" /></div>' +
                    '<div class="qr-hint"></div>' +
                    '<div class="session-actions">' +
                        '<button class="btn btn-danger btn-block logout-btn">Keluar</button>' +
                    '</div>';

                card.querySelector(".logout-btn").addEventListener("click", function ()
                {
                    if (confirm(i18n.t("confirm.logoutSession", { id: session.id })))
                    {
                        socket.emit("logout-session", { id: session.id });
                        toast(i18n.t("toast.loggingOut", { id: session.id }));
                    }
                });

                grid.appendChild(card);
                refreshStats();
            }

            function updateStatus(id, status)
            {
                const card = document.getElementById("session-" + id);
                if (!card)
                {
                    return;
                }

                card.dataset.status = status;
                const badge = card.querySelector(".badge");
                badge.className = "badge " + status;
                badge.innerHTML = '<span class="dot"></span>' + statusText(status);

                const qrWrap = card.querySelector(".qr-wrap");
                const hint = card.querySelector(".qr-hint");

                if (status === "ready" || status === "authenticated")
                {
                    qrWrap.classList.remove("show");
                    hint.textContent = "";
                }

                refreshStats();
            }

            socket.on("init", function (sessions)
            {
                grid.innerHTML = "";
                sessions.forEach(renderCard);
                refreshStats();
            });

            socket.on("session-added", function (session)
            {
                if (!document.getElementById("session-" + session.id))
                {
                    renderCard({ id: session.id, description: session.description, status: "initializing" });
                }
            });

            socket.on("qr", function (data)
            {
                const card = document.getElementById("session-" + data.id);
                if (!card)
                {
                    return;
                }

                const qrWrap = card.querySelector(".qr-wrap");
                qrWrap.querySelector("img").src = data.src;
                qrWrap.classList.add("show");
                card.querySelector(".qr-hint").textContent = i18n.t("qr.hint");
            });

            socket.on("status", function (data)
            {
                updateStatus(data.id, data.status);
            });

            socket.on("remove-session", function (id)
            {
                const card = document.getElementById("session-" + id);
                if (card)
                {
                    card.remove();
                    refreshStats();
                    toast(i18n.t("toast.sessionRemoved", { id: id }));
                }
            });

            socket.on("message", function (data)
            {
                if (data && data.text)
                {
                    toast(data.text, true);
                }
            });

            document.getElementById("client-id").addEventListener("input", function (e)
            {
                e.target.value = e.target.value.replace(/[^a-zA-Z0-9_-]/g, "");
            });

            function todayDescription()
            {
                const now = new Date();
                return now.getFullYear() + "-" +
                    String(now.getMonth() + 1).padStart(2, "0") + "-" +
                    String(now.getDate()).padStart(2, "0");
            }

            document.getElementById("create-form").addEventListener("submit", function (e)
            {
                e.preventDefault();
                const id = document.getElementById("client-id").value.trim();

                if (!id)
                {
                    toast(i18n.t("toast.sessionIdRequired"), true);
                    return;
                }

                if (document.getElementById("session-" + id))
                {
                    toast(i18n.t("toast.sessionIdUsed"), true);
                    return;
                }

                socket.emit("create-session", { id: id, description: todayDescription() });
                e.target.reset();
            });

            async function loadUser()
            {
                try
                {
                    const res = await fetch("/me");
                    const json = await res.json();
                    if (!json.status)
                    {
                        return;
                    }

                    const box = document.getElementById("sidebar-user");
                    const avatar = document.createElement("img");
                    avatar.className = "user-avatar";
                    avatar.src = json.user.avatar || "";
                    avatar.alt = "";

                    const info = document.createElement("div");
                    info.className = "user-info";
                    const name = document.createElement("div");
                    name.className = "user-name";
                    name.textContent = json.user.name || json.user.email;
                    const logout = document.createElement("button");
                    logout.className = "user-logout";
                    logout.setAttribute("data-i18n", "user.logout");
                    logout.textContent = i18n.t("user.logout");
                    logout.addEventListener("click", async function ()
                    {
                        await fetch("/auth/logout", { method: "POST" });
                        window.location.href = "/login";
                    });

                    info.appendChild(name);
                    info.appendChild(logout);
                    box.appendChild(avatar);
                    box.appendChild(info);
                }
                catch (err)
                {
                    return;
                }
            }

            loadUser();
        </script>
    </body>
</html>
